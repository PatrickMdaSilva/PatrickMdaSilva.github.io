<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="css/style.css" rel="stylesheet">
        <script src="js/scripts.js">
            
        </script>
    </head>
    <body>
        <div class="banner" id="home">
            <img class="openImg" src="img/5c472d1d-e202-4a53-b2d3-2b2d292be711.png" alt="pokemon">
            <div class="content">
                <h1>PokéMoN GaMe API</h1><br>
            </div>
            <div class="players">
                <div class="player">
                    <img src="img/player1.svg" alt="pokemon">
                </div>
                <div class="botao">
                    <button onclick="location.reload()" type="submit"
                        id="reiniciar">Reset</button>
                </div>
                <div class="player">
                    <img src="img/player2.svg" alt="pokemon">
                </div>
            </div>
            <div class="batle">
                <div class="container-2">

                    <div class="ball-wrapper">
                        <div class="pokeball"></div>
                        <div class="pokemon-slot"></div>
                    </div>

                    <div class="ball-wrapper">
                        <div class="pokeball"></div>
                        <div class="pokemon-slot"></div>
                    </div>

                    <div class="ball-wrapper">
                        <div class="pokeball"></div>
                        <div class="pokemon-slot"></div>
                    </div>

                </div>
                <div class="container-1">
                    <div class="ball-wrapper">
                        <div class="pokeball pokeball-2"></div>
                        <div class="pokemon-slot"></div>
                    </div>

                    <div class="ball-wrapper">
                        <div class="pokeball pokeball-2"></div>
                        <div class="pokemon-slot"></div>
                    </div>

                    <div class="ball-wrapper">
                        <div class="pokeball pokeball-2"></div>
                        <div class="pokemon-slot"></div>
                    </div>

                </div>
            </div>
            <audio id="pokeSound">
                <source src="pokeball.mp3" type="audio/mpeg">
            </audio>
        </div>
        <div id="time-1"></div>
        <div id="time-2"></div>
        <audio autoplay loop controls id="meuAudio">
            <source src="Pokemon.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>
        <script src="js/ballsAnimation.js"></script>
    </body>
</html>
