<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <div class="banner" id="home">
            <img class="openImg" src="img/poke.jpg" alt="pokemon">
            <div class="content">
                <h1>PokéMoN GaMe API</h1><br>
            </div>
            <div class="players">
                <div class="player">
                    <p>Player1</p>
                    <img src="img/player1.svg" alt="pokemon">
                </div>
                <div class="botao">
                    <button type="submit" id="reiniciar">Reiniciar</button>
                </div>
                <div class="player">
                    <p>Player2</p>
                    <img src="img/player2.svg" alt="pokemon">
                </div>
            </div>
            <div class="batle">
                <div class="container-1">
                    <div class="pokeball"></div>
                    <div class="pokeball"></div>
                    <div class="pokeball"></div>
                </div>
                <div class="container-2">
                    <div class="pokeball pokeball-2"></div>
                    <div class="pokeball pokeball-2"></div>
                    <div class="pokeball pokeball-2"></div>
                </div>
            </div>
            <audio id="pokeSound">
                <source src="pokeball.mp3" type="audio/mpeg">
            </audio>
        </div>
        <audio autoplay loop controls id="meuAudio">
            <source src="Pokemon.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>

        <script>
        // Tenta reproduzir com som após a interação do usuário, 
        // caso o navegador bloqueie o autoplay sonoro
        window.addEventListener('click', function() {
            var audio = document.getElementById('meuAudio');
            audio.muted = false;
            audio.play();
        }, { once: true }); // Executa apenas uma vez

        const pokeballs = document.querySelectorAll(".pokeball");
        const sound = document.getElementById("pokeSound");

        pokeballs.forEach(ball => {
            ball.addEventListener("click", function () {

                // anima somente a pokébola clicada
                this.classList.remove("rotate");
                void this.offsetWidth;
                this.classList.add("rotate");

                // reinicia e toca o som
                sound.currentTime = 0;
                sound.play();

            });
        });
        </script>
    </body>
</html>
